<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob: file:; font-src 'self' data:;">
<title>MD-To Desktop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<div class="titlebar">
  <div class="brand">
    <span class="logo">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h6l2 3 2-3h6v14h-6l-2-3-2 3H4z" stroke="none" fill="currentColor" opacity=".18"/>
        <path d="M4 6h5l3 4 3-4h5"/>
        <path d="M12 9v10"/>
      </svg>
    </span>
    <div class="brand-text">
      <strong>MD-To</strong><span>Desktop</span>
    </div>
  </div>
  <div class="crumb" id="crumb">Markdown → PDF</div>
  <div class="titlebar-right">
    <span class="offline-dot" title="全部转换在本机完成"></span>
    <span class="offline-text">本地处理</span>
    <button class="icon-btn" id="themeBtn" title="切换明暗主题">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="text" placeholder="搜索工具…" spellcheck="false">
    </div>
    <nav class="tool-list" id="toolList"></nav>
    <div class="sidebar-foot">
      <span>17 个转换工具 · 1 个编辑器</span>
    </div>
  </aside>

  <main class="workspace" id="workspace">
    <section class="pane" id="paneInput">
      <header class="pane-head">
        <div class="pane-head-left">
          <span class="pane-title" id="inputTitle">Markdown</span>
          <span class="meta" id="inputMeta"></span>
        </div>
        <div class="pane-head-right">
          <button class="mini-btn" id="btnOpen" title="打开文件 (Ctrl+O)">打开</button>
          <button class="mini-btn" id="btnSample" title="载入示例">示例</button>
          <button class="mini-btn" id="btnClear" title="清空">清空</button>
        </div>
      </header>
      <div class="pane-body">
        <div class="editor-wrap" id="editorWrap">
          <textarea id="editor" spellcheck="false" placeholder="在这里粘贴或输入 Markdown…"></textarea>
          <div class="dropzone hidden" id="dropzone">
            <div class="dz-inner">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>
              </svg>
              <p class="dz-title" id="dzTitle">拖入文件，或点击选择</p>
              <p class="dz-sub" id="dzSub"></p>
              <div class="dz-file hidden" id="dzFile"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitter"></div>

    <section class="pane" id="panePreview">
      <header class="pane-head">
        <div class="pane-head-left">
          <span class="pane-title">预览</span>
          <span class="meta" id="previewMeta"></span>
        </div>
        <div class="pane-head-right">
          <button class="mini-icon" id="zoomOut" title="缩小">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
          <button class="zoom-label" id="zoomLabel" title="点击恢复 100%">100%</button>
          <button class="mini-icon" id="zoomIn" title="放大">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="mini-btn" id="btnCopyInline" title="复制结果 (Ctrl+Shift+C)">复制</button>
        </div>
      </header>
      <div class="pane-body preview-body" id="previewBody">
        <div class="paper-scroll" id="paperScroll">
          <div class="paper-wrap" id="paperWrap">
            <div class="paper" id="paper">
              <iframe id="preview" sandbox="allow-same-origin allow-scripts"></iframe>
            </div>
          </div>
        </div>
        <div class="code-scroll hidden" id="codeScroll">
          <pre class="code-out" id="codeOut"></pre>
        </div>
        <div class="empty-state hidden" id="emptyState">
          <p>还没有可预览的内容</p>
        </div>
      </div>
    </section>
  </main>

  <aside class="options">
    <header class="options-head">
      <span>转换选项</span>
      <button class="link-btn" id="btnReset">重置</button>
    </header>
    <div class="options-body" id="optionsBody"></div>
    <footer class="options-foot">
      <button class="btn primary" id="btnPrimary">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>
        </svg>
        <span id="btnPrimaryLabel">导出 PDF</span>
      </button>
      <button class="btn ghost" id="btnCopy">复制结果</button>
    </footer>
  </aside>
</div>

<div class="toast" id="toast"></div>
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <strong id="modalTitle">选择模板</strong>
      <button class="mini-icon" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="boot.js"></script>
</body>
</html>
